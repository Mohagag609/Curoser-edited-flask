{# Toast notification partial #}
<div id="toast-container" 
     class="fixed top-4 left-4 z-50 space-y-2"
     x-data="{ toasts: [] }"
     @notify.window="
        let id = Date.now();
        toasts.push({ id: id, type: $event.detail.type || 'info', message: $event.detail.message });
        setTimeout(() => { toasts = toasts.filter(t => t.id !== id) }, 5000);
     ">
    <template x-for="toast in toasts" :key="toast.id">
        <div x-transition:enter="transform ease-out duration-300 transition"
             x-transition:enter-start="translate-y-2 opacity-0"
             x-transition:enter-end="translate-y-0 opacity-100"
             x-transition:leave="transition ease-in duration-100"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             :class="{
                'bg-green-50 text-green-800 border-green-200': toast.type === 'success',
                'bg-red-50 text-red-800 border-red-200': toast.type === 'error',
                'bg-yellow-50 text-yellow-800 border-yellow-200': toast.type === 'warning',
                'bg-blue-50 text-blue-800 border-blue-200': toast.type === 'info'
             }"
             class="max-w-sm w-full shadow-lg rounded-lg pointer-events-auto border p-4">
            <div class="flex items-start">
                <div class="flex-1">
                    <p class="text-sm font-medium" x-text="toast.message"></p>
                </div>
                <button @click="toasts = toasts.filter(t => t.id !== toast.id)"
                        class="mr-4 flex-shrink-0 rounded-md inline-flex text-gray-400 hover:text-gray-500 focus:outline-none">
                    <span class="sr-only">إغلاق</span>
                    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </div>
    </template>
</div>
