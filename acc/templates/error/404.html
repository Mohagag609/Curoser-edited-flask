{% extends "base.html" %}

{% block title %}الصفحة غير موجودة{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12">
    <div class="max-w-md w-full text-center">
        <div class="mb-8">
            <div class="inline-flex items-center justify-center w-24 h-24 bg-yellow-100 rounded-full mb-6">
                <i class="fas fa-search text-4xl text-yellow-600"></i>
            </div>
            
            <h1 class="text-4xl font-bold text-gray-800 mb-4">404</h1>
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">الصفحة غير موجودة</h2>
            
            <p class="text-gray-600 mb-8">
                عذراً، لا يمكننا العثور على الصفحة التي تبحث عنها.
            </p>
            
            <div class="space-y-3">
                <a href="{{ url_for('main.index') }}" class="modern-btn modern-btn-secondary">
                    <i class="fas fa-home"></i>
                    الصفحة الرئيسية
                </a>
                
                <button onclick="window.history.back()" class="modern-btn modern-btn-secondary">
                    <i class="fas fa-arrow-right"></i>
                    رجوع
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
