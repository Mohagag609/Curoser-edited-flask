{% extends "base.html" %}

{% block title %}تعديل {{ safe.name }} - {{ super() }}{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-3xl font-bold text-gray-900">تعديل بيانات الخزينة</h2>
        <a href="{{ url_for('treasury.safe_detail', id=safe.id) }}" class="btn btn-secondary">
            <i class="fas fa-arrow-right"></i>
            العودة للتفاصيل
        </a>
    </div>
    
    <!-- Form -->
    <div class="card max-w-2xl mx-auto">
        <form method="post" action="{{ url_for('treasury.edit_safe', id=safe.id) }}">
            <div class="space-y-6">
                <div>
                    <label class="form-label">اسم الخزينة <span class="text-red-500">*</span></label>
                    <input type="text" name="name" value="{{ safe.name }}" required class="form-input" autofocus>
                </div>
                
                <div>
                    <label class="form-label">النوع <span class="text-red-500">*</span></label>
                    <select name="type" class="form-select" onchange="toggleBankFields(this)">
                        <option value="cash" {% if safe.type == 'cash' %}selected{% endif %}>خزينة نقدية</option>
                        <option value="bank" {% if safe.type == 'bank' %}selected{% endif %}>حساب بنكي</option>
                    </select>
                </div>
                
                <div id="bank-fields" class="{% if safe.type != 'bank' %}hidden{% endif %} space-y-4">
                    <div>
                        <label class="form-label">اسم البنك</label>
                        <input type="text" name="bank_name" value="{{ safe.bank_name or '' }}" class="form-input">
                    </div>
                    
                    <div>
                        <label class="form-label">رقم الحساب</label>
                        <input type="text" name="account_number" value="{{ safe.account_number or '' }}" class="form-input" dir="ltr">
                    </div>
                </div>
                
                <div>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="is_default" value="1" {% if safe.is_default %}checked{% endif %} class="rounded">
                        <span>تعيين كخزينة افتراضية</span>
                    </label>
                </div>
                
                <div>
                    <label class="form-label">ملاحظات</label>
                    <textarea name="notes" rows="3" class="form-input">{{ safe.notes or '' }}</textarea>
                </div>
            </div>
            
            <div class="mt-6 flex justify-end gap-2">
                <a href="{{ url_for('treasury.safe_detail', id=safe.id) }}" class="btn btn-secondary">
                    إلغاء
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i>
                    حفظ التعديلات
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function toggleBankFields(select) {
    const bankFields = document.getElementById('bank-fields');
    if (select.value === 'bank') {
        bankFields.classList.remove('hidden');
    } else {
        bankFields.classList.add('hidden');
    }
}
</script>
{% endblock %}
