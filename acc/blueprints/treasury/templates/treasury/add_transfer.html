{% extends "base.html" %}

{% block title %}تحويل بين الخزائن - {{ super() }}{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-3xl font-bold text-gray-900">تحويل بين الخزائن</h2>
        <a href="{{ url_for('treasury.transfers') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-right"></i>
            العودة للتحويلات
        </a>
    </div>
    
    <!-- Form -->
    <div class="card max-w-2xl mx-auto">
        <form method="post" action="{{ url_for('treasury.add_transfer') }}" onsubmit="return validateTransfer()">
            <div class="space-y-6">
                <div>
                    <label class="form-label">من خزينة <span class="text-red-500">*</span></label>
                    <select name="from_safe_id" id="from_safe" required class="form-select" onchange="updateBalance()">
                        <option value="">اختر الخزينة...</option>
                        {% for safe in safes %}
                        <option value="{{ safe.id }}" data-balance="{{ safe.balance }}">
                            {{ safe.name }} ({{ format_currency(safe.balance) }})
                        </option>
                        {% endfor %}
                    </select>
                    <p id="from_balance" class="text-sm text-gray-500 mt-1"></p>
                </div>
                
                <div>
                    <label class="form-label">إلى خزينة <span class="text-red-500">*</span></label>
                    <select name="to_safe_id" id="to_safe" required class="form-select">
                        <option value="">اختر الخزينة...</option>
                        {% for safe in safes %}
                        <option value="{{ safe.id }}">{{ safe.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label class="form-label">المبلغ <span class="text-red-500">*</span></label>
                    <input type="number" name="amount" id="amount" step="0.01" min="0.01" required class="form-input">
                </div>
                
                <div>
                    <label class="form-label">التاريخ <span class="text-red-500">*</span></label>
                    <input type="date" name="date" value="{{ today }}" required class="form-input">
                </div>
                
                <div>
                    <label class="form-label">البيان</label>
                    <input type="text" name="description" class="form-input">
                </div>
                
                <div>
                    <label class="form-label">ملاحظات</label>
                    <textarea name="notes" rows="3" class="form-input"></textarea>
                </div>
            </div>
            
            <div class="mt-6 flex justify-end gap-2">
                <a href="{{ url_for('treasury.transfers') }}" class="btn btn-secondary">
                    إلغاء
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-check"></i>
                    تنفيذ التحويل
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function updateBalance() {
    const fromSafe = document.getElementById('from_safe');
    const balanceEl = document.getElementById('from_balance');
    const amountInput = document.getElementById('amount');
    
    if (fromSafe.value) {
        const selectedOption = fromSafe.options[fromSafe.selectedIndex];
        const balance = parseFloat(selectedOption.getAttribute('data-balance'));
        balanceEl.textContent = `الرصيد المتاح: ${balance.toLocaleString('ar-EG', {minimumFractionDigits: 2, maximumFractionDigits: 2})} ج.م`;
        amountInput.max = balance;
    } else {
        balanceEl.textContent = '';
        amountInput.removeAttribute('max');
    }
}

function validateTransfer() {
    const fromSafe = document.getElementById('from_safe').value;
    const toSafe = document.getElementById('to_safe').value;
    const amount = parseFloat(document.getElementById('amount').value);
    
    if (fromSafe === toSafe) {
        alert('لا يمكن التحويل من وإلى نفس الخزينة');
        return false;
    }
    
    const selectedOption = document.getElementById('from_safe').options[document.getElementById('from_safe').selectedIndex];
    const balance = parseFloat(selectedOption.getAttribute('data-balance'));
    
    if (amount > balance) {
        alert('المبلغ المطلوب تحويله أكبر من الرصيد المتاح');
        return false;
    }
    
    return confirm(`تأكيد التحويل: ${amount} ج.م؟`);
}
</script>
{% endblock %}
