{% extends "base.html" %}

{% block title %}تعديل {{ customer.name }} - {{ super() }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-900">تعديل بيانات العميل</h2>
    </div>
    
    <div class="card">
        <form method="post" action="{{ url_for('customers.edit', id=customer.id) }}">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="form-label" for="name">اسم العميل *</label>
                    <input type="text" 
                           id="name" 
                           name="name" 
                           value="{{ customer.name }}"
                           class="form-input" 
                           required>
                </div>
                
                <div>
                    <label class="form-label" for="phone">رقم الهاتف</label>
                    <input type="text" 
                           id="phone" 
                           name="phone" 
                           value="{{ customer.phone or '' }}"
                           class="form-input"
                           placeholder="اختياري">
                </div>
                
                <div>
                    <label class="form-label" for="national_id">الرقم القومي</label>
                    <input type="text" 
                           id="national_id" 
                           name="national_id" 
                           value="{{ customer.national_id or '' }}"
                           class="form-input">
                </div>
                
                <div>
                    <label class="form-label" for="status">الحالة</label>
                    <select id="status" name="status" class="form-select">
                        <option value="نشط" {% if customer.status == 'نشط' %}selected{% endif %}>نشط</option>
                        <option value="غير نشط" {% if customer.status == 'غير نشط' or customer.status == 'موقوف' %}selected{% endif %}>غير نشط</option>
                    </select>
                </div>
                
                <div class="md:col-span-2">
                    <label class="form-label" for="address">العنوان</label>
                    <input type="text" 
                           id="address" 
                           name="address" 
                           value="{{ customer.address or '' }}"
                           class="form-input">
                </div>
                
                <div class="md:col-span-2">
                    <label class="form-label" for="notes">ملاحظات</label>
                    <textarea id="notes" 
                              name="notes" 
                              rows="3" 
                              class="form-input">{{ customer.notes or '' }}</textarea>
                </div>
            </div>
            
            <div class="mt-6 flex gap-3">
                <button type="submit" class="btn btn-primary">حفظ التغييرات</button>
                <a href="{{ url_for('customers.detail', id=customer.id) }}" class="btn btn-secondary">إلغاء</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
