<!-- Header -->
<div class="flex items-center justify-between mb-4">
    <h3 class="text-lg font-semibold">تعديل بيانات العميل</h3>
    <button @click="showEditModal = false" class="text-gray-400 hover:text-gray-600">
        <i class="fas fa-times"></i>
    </button>
</div>

<!-- Form -->
<form hx-put="{{ url_for('customers.update_ajax', id=customer.id) }}"
      hx-target="#customer-{{ customer.id }}"
      hx-swap="outerHTML"
      @htmx:after-request="if(event.detail.successful) { showEditModal = false; }">
    
    <div class="space-y-4">
        <div>
            <label class="form-label">الكود</label>
            <input type="text" value="{{ customer.code }}" class="form-input bg-gray-100" disabled>
        </div>
        
        <div>
            <label class="form-label">الاسم <span class="text-red-500">*</span></label>
            <input type="text" name="name" value="{{ customer.name }}" class="form-input" required>
        </div>
        
        <div>
            <label class="form-label">الهاتف</label>
            <input type="tel" name="phone" value="{{ customer.phone or '' }}" class="form-input" dir="ltr">
        </div>
        
        <div>
            <label class="form-label">الهوية الوطنية</label>
            <input type="text" name="national_id" value="{{ customer.national_id or '' }}" class="form-input">
        </div>
        
        <div>
            <label class="form-label">العنوان</label>
            <textarea name="address" class="form-input" rows="2">{{ customer.address or '' }}</textarea>
        </div>
        
        <div>
            <label class="form-label">الحالة</label>
            <select name="status" class="form-select">
                <option value="نشط" {% if customer.status == 'نشط' %}selected{% endif %}>نشط</option>
                <option value="معلق" {% if customer.status == 'معلق' %}selected{% endif %}>معلق</option>
            </select>
        </div>
        
        <div>
            <label class="form-label">ملاحظات</label>
            <textarea name="notes" class="form-input" rows="2">{{ customer.notes or '' }}</textarea>
        </div>
    </div>
    
    <div class="flex justify-end gap-3 mt-6">
        <button type="button" @click="showEditModal = false" class="modern-btn modern-btn-ghost">
            إلغاء
        </button>
        <button type="submit" class="modern-btn modern-btn-primary">
            <i class="fas fa-save ml-2"></i>
            حفظ التعديلات
        </button>
    </div>
</form>
