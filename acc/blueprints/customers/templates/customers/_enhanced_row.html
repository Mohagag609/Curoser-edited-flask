<tr class="hover:bg-gray-50 transition-colors" data-id="{{ customer.id }}">
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
        <span class="inline-flex px-3 py-1 text-xs font-semibold rounded-full bg-blue-100 text-blue-800">
            {{ customer.code }}
        </span>
    </td>
    <td class="px-6 py-4 whitespace-nowrap">
        <div class="text-sm font-medium text-gray-900">{{ customer.name }}</div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600 font-mono" dir="ltr">
        {{ customer.phone or '-' }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">
        {{ customer.national_id or '-' }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">
        {{ customer.address or '-' }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap">
        {% if customer.status == 'نشط' %}
            <span class="inline-flex px-3 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">
                <i class="fas fa-check-circle ml-1"></i>
                نشط
            </span>
        {% else %}
            <span class="inline-flex px-3 py-1 text-xs font-semibold rounded-full bg-gray-100 text-gray-800">
                <i class="fas fa-pause-circle ml-1"></i>
                معلق
            </span>
        {% endif %}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-left">
        <div class="flex gap-2">
            <a href="{{ url_for('customers.detail', id=customer.id) }}"
               class="modern-btn modern-btn-view action-btn-lg">
                <i class="fas fa-eye"></i>
                <span>عرض</span>
            </a>
            <a href="{{ url_for('customers.edit', id=customer.id) }}"
               class="modern-btn modern-btn-edit action-btn-lg">
                <i class="fas fa-edit"></i>
                <span>تعديل</span>
            </a>
            <button type="button"
                    onclick="deleteCustomer('{{ customer.id }}', '{{ customer.name }}')"
                    class="modern-btn modern-btn-delete action-btn-lg">
                <i class="fas fa-trash"></i>
                <span>حذف</span>
            </button>
        </div>
    </td>
</tr>
