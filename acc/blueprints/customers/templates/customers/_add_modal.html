<form hx-post="{{ url_for('customers.add_ajax') }}"
      hx-target="#customers-table-body"
      hx-swap="afterbegin"
      hx-on::after-request="if(event.detail.successful) { showAddModal = false; }"
      class="space-y-4">

    <div class="flex justify-between items-center">
        <h3 class="text-xl font-bold">
            <i class="fas fa-user-plus text-blue-500 ml-2"></i>
            إضافة عميل جديد
        </h3>
        <button type="button" @click="showAddModal = false" class="text-gray-400 hover:text-gray-600">
            <i class="fas fa-times fa-lg"></i>
        </button>
    </div>

    <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">اسم العميل <span class="text-red-500">*</span></label>
        <input type="text" id="name" name="name"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
               placeholder="ادخل اسم العميل" required autofocus>
    </div>

    <div>
        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">الهاتف</label>
        <input type="tel" id="phone" name="phone"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
               placeholder="ادخل رقم الهاتف">
    </div>

    <div>
        <label for="national_id" class="block text-sm font-medium text-gray-700 mb-1">الرقم القومي</label>
        <input type="text" id="national_id" name="national_id"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
               placeholder="ادخل الرقم القومي">
    </div>

    <div>
        <label for="address" class="block text-sm font-medium text-gray-700 mb-1">العنوان</label>
        <input type="text" id="address" name="address"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
               placeholder="ادخل العنوان">
    </div>

    <input type="hidden" name="status" value="نشط">

    <div class="flex justify-end gap-3 pt-4">
        <button type="button" @click="showAddModal = false"
                class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-all">
            إلغاء
        </button>
        <button type="submit"
                class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all shadow-md">
            <i class="fas fa-check ml-1"></i>
            حفظ
        </button>
    </div>
</form>
