{% extends "base.html" %}

{% block title %}العملاء{% endblock %}
{% block page_title %}العملاء{% endblock %}

{% block content %}
<div class="space-y-6" x-data="customersApp()">
    <!-- Header -->
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
            <a href="{{ url_for('dashboard.index') }}" class="modern-btn modern-btn-ghost">
                <i class="fas fa-arrow-right"></i>
                <span>الرئيسية</span>
            </a>
        </div>
        
        <div class="flex items-center gap-4">
            <!-- Search -->
            <div class="relative">
                <input type="text" 
                       placeholder="بحث..."
                       class="form-input pr-10"
                       hx-get="{{ url_for('customers.search') }}"
                       hx-trigger="keyup changed delay:300ms"
                       hx-target="#customers-tbody"
                       name="q">
                <i class="fas fa-search absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
            </div>
            
            <!-- Add Button -->
            <button @click="showAddModal = true" class="modern-btn modern-btn-primary">
                <i class="fas fa-plus ml-2"></i>
                إضافة عميل جديد
            </button>
        </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-lg shadow-sm overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">الكود</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">الاسم</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">الهاتف</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">الحالة</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">الإجراءات</th>
                </tr>
            </thead>
            <tbody id="customers-tbody" class="bg-white divide-y divide-gray-200">
                {% include 'customers/_table_rows.html' %}
            </tbody>
        </table>
    </div>

    <!-- Add Modal -->
    <div x-show="showAddModal" 
         x-cloak
         @keydown.escape="showAddModal = false"
         class="fixed inset-0 z-50 overflow-y-auto">
        <!-- Backdrop -->
        <div class="fixed inset-0 bg-black bg-opacity-25" @click="showAddModal = false"></div>
        
        <!-- Modal -->
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="relative bg-white rounded-lg shadow-xl max-w-md w-full p-6" @click.away="showAddModal = false">
                <!-- Header -->
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold">إضافة عميل جديد</h3>
                    <button @click="showAddModal = false" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <!-- Form -->
                <form hx-post="{{ url_for('customers.add_ajax') }}"
                      hx-target="#customers-tbody"
                      hx-swap="afterbegin"
                      @htmx:after-request="if(event.detail.successful) { showAddModal = false; $el.reset(); }">
                    
                    <div class="space-y-4">
                        <div>
                            <label class="form-label">الاسم <span class="text-red-500">*</span></label>
                            <input type="text" name="name" class="form-input" required autofocus>
                        </div>
                        
                        <div>
                            <label class="form-label">الهاتف</label>
                            <input type="tel" name="phone" class="form-input" dir="ltr">
                        </div>
                        
                        <div>
                            <label class="form-label">الهوية الوطنية</label>
                            <input type="text" name="national_id" class="form-input">
                        </div>
                        
                        <div>
                            <label class="form-label">العنوان</label>
                            <textarea name="address" class="form-input" rows="2"></textarea>
                        </div>
                        
                        <div>
                            <label class="form-label">ملاحظات</label>
                            <textarea name="notes" class="form-input" rows="2"></textarea>
                        </div>
                    </div>
                    
                    <div class="flex justify-end gap-3 mt-6">
                        <button type="button" @click="showAddModal = false" class="modern-btn modern-btn-ghost">
                            إلغاء
                        </button>
                        <button type="submit" class="modern-btn modern-btn-primary">
                            <i class="fas fa-save ml-2"></i>
                            حفظ
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div x-show="showEditModal" 
         x-cloak
         @keydown.escape="showEditModal = false"
         class="fixed inset-0 z-50 overflow-y-auto">
        <!-- Backdrop -->
        <div class="fixed inset-0 bg-black bg-opacity-25" @click="showEditModal = false"></div>
        
        <!-- Modal -->
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="relative bg-white rounded-lg shadow-xl max-w-md w-full p-6" 
                 @click.away="showEditModal = false"
                 id="edit-modal-content">
                <!-- Content will be loaded via HTMX -->
            </div>
        </div>
    </div>
</div>

<script>
function customersApp() {
    return {
        showAddModal: false,
        showEditModal: false,
        
        editCustomer(id) {
            htmx.ajax('GET', `/customers/${id}/edit-modal`, {
                target: '#edit-modal-content',
                swap: 'innerHTML'
            }).then(() => {
                this.showEditModal = true;
            });
        },
        
        deleteCustomer(id, name) {
            if (confirm(`هل أنت متأكد من حذف العميل "${name}"؟`)) {
                htmx.ajax('DELETE', `/customers/${id}/delete-ajax`, {
                    target: `#customer-${id}`,
                    swap: 'outerHTML swap:0.3s'
                });
            }
        }
    }
}
</script>

<style>
/* إزالة أي تأثيرات blur أو خلفيات مزعجة */
[x-cloak] { display: none !important; }

/* تحسين Modal */
.fixed {
    animation: fadeIn 0.2s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* تحسين الجدول */
tbody tr {
    transition: background-color 0.15s ease;
}

tbody tr:hover {
    background-color: #f9fafb;
}

/* إزالة أي تأثيرات غير ضرورية */
* {
    backdrop-filter: none !important;
}
</style>
{% endblock %}
