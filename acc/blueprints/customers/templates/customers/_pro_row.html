<tr id="customer-{{ customer.id }}">
    <td>
        <span style="background: #dbeafe; color: #1e40af; padding: 4px 12px; border-radius: 6px; font-weight: 600; font-size: 12px;">
            {{ customer.code }}
        </span>
    </td>
    <td>
        <div style="font-weight: 600;">{{ customer.name }}</div>
        {% if customer.national_id %}
        <div style="font-size: 12px; color: #64748b; margin-top: 2px;">{{ customer.national_id }}</div>
        {% endif %}
    </td>
    <td dir="ltr" style="font-family: monospace;">{{ customer.phone or '-' }}</td>
    <td>{{ customer.address or '-' }}</td>
    <td>
        {% if customer.status == 'نشط' %}
            <span class="status-badge status-active">
                <i class="fas fa-check-circle"></i>
                نشط
            </span>
        {% else %}
            <span class="status-badge status-inactive">
                <i class="fas fa-pause-circle"></i>
                معلق
            </span>
        {% endif %}
    </td>
    <td>
        <div class="action-buttons">
            <a href="{{ url_for('customers.detail', id=customer.id) }}" 
               class="pro-btn pro-btn-sm" style="background: #e0e7ff; color: #3730a3;">
                <i class="fas fa-eye"></i>
                عرض
            </a>
            <a href="{{ url_for('customers.edit', id=customer.id) }}" 
               class="pro-btn pro-btn-sm" style="background: #d1fae5; color: #065f46;">
                <i class="fas fa-edit"></i>
                تعديل
            </a>
            <button onclick="deleteCustomer('{{ customer.id }}', '{{ customer.name }}')"
                    class="pro-btn pro-btn-sm pro-btn-danger">
                <i class="fas fa-trash"></i>
                حذف
            </button>
        </div>
    </td>
</tr>
