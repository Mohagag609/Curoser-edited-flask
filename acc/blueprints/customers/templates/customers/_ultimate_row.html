<tr id="customer-row-{{ customer.id }}">
    <td>
        <span class="customer-code">{{ customer.code }}</span>
    </td>
    <td>
        <div class="customer-info">
            <div class="customer-name">{{ customer.name }}</div>
            {% if customer.national_id %}
            <div class="customer-id">الرقم القومي: {{ customer.national_id }}</div>
            {% endif %}
        </div>
    </td>
    <td>
        {% if customer.phone %}
        <span class="phone-number" dir="ltr">{{ customer.phone }}</span>
        {% else %}
        <span style="color: #adb5bd;">-</span>
        {% endif %}
    </td>
    <td>{{ customer.address or '-' }}</td>
    <td>
        {% if customer.status == 'نشط' %}
            <span class="status-badge status-active">
                <i class="fas fa-check-circle"></i>
                نشط
            </span>
        {% else %}
            <span class="status-badge status-inactive">
                <i class="fas fa-pause-circle"></i>
                معلق
            </span>
        {% endif %}
    </td>
    <td>
        <div class="action-buttons">
            <a href="{{ url_for('customers.detail', id=customer.id) }}" 
               class="btn btn-sm btn-light">
                <i class="fas fa-eye"></i>
                عرض
            </a>
            <a href="{{ url_for('customers.edit', id=customer.id) }}" 
               class="btn btn-sm btn-light">
                <i class="fas fa-edit"></i>
                تعديل
            </a>
            <button onclick="confirmDelete('{{ customer.id }}', '{{ customer.name }}')"
                    class="btn btn-sm btn-danger">
                <i class="fas fa-trash"></i>
                حذف
            </button>
        </div>
    </td>
</tr>
