{% extends "base.html" %}

{% block title %}إضافة مجموعة شركاء{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <!-- Header -->
    <div class="mb-6 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <a href="{{ url_for('partners.groups') }}" class="modern-btn modern-btn-back modern-btn-sm">
                <i class="fas fa-arrow-right"></i>
                <span>رجوع</span>
            </a>
            <h2 class="text-2xl font-bold text-gray-900">إضافة مجموعة شركاء جديدة</h2>
        </div>
    </div>
    
    <!-- Form Card -->
    <div class="card">
        <form method="post" action="{{ url_for('partners.add_group') }}">
            
            <!-- Auto Code Notice -->
            <div class="mb-6 bg-purple-50 border border-purple-200 rounded-lg p-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <i class="fas fa-info-circle text-purple-400"></i>
                    </div>
                    <div class="mr-3">
                        <p class="text-sm text-purple-700">
                            سيتم إنشاء رقم المجموعة تلقائياً عند الحفظ
                        </p>
                    </div>
                </div>
            </div>
            
            <!-- Name -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    اسم المجموعة <span class="text-red-500">*</span>
                </label>
                <input type="text" name="name" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500"
                       placeholder="مثال: مجموعة الشركاء الرئيسيين"
                       autofocus>
            </div>
            
            <!-- Notes -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    ملاحظات
                </label>
                <textarea name="notes" rows="3"
                          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500"
                          placeholder="أي ملاحظات إضافية..."></textarea>
            </div>
            
            <!-- Notice -->
            <div class="mb-6 bg-blue-50 border border-blue-200 rounded-lg p-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <i class="fas fa-lightbulb text-blue-400"></i>
                    </div>
                    <div class="mr-3">
                        <p class="text-sm text-blue-700">
                            بعد إنشاء المجموعة، ستتمكن من إضافة الشركاء وتحديد نسبة كل شريك
                        </p>
                    </div>
                </div>
            </div>
            
            <!-- Submit -->
            <div class="flex justify-end gap-3">
                <a href="{{ url_for('partners.groups') }}" class="modern-btn modern-btn-secondary">
                    <i class="fas fa-times"></i>
                    <span>إلغاء</span>
                </a>
                <button type="submit" class="modern-btn modern-btn-primary">
                    <i class="fas fa-save"></i>
                    <span>حفظ المجموعة</span>
                </button>
            </div>
        </form>
    </div>
</div>

<style>
/* Ensure buttons are visible */
.modern-btn {
    display: inline-flex !important;
    align-items: center !important;
    gap: 0.5rem !important;
    padding: 0.5rem 1rem !important;
    font-size: 0.875rem !important;
    font-weight: 500 !important;
    border-radius: 0.5rem !important;
    transition: all 0.15s ease !important;
    cursor: pointer !important;
    text-decoration: none !important;
    border: 1px solid transparent !important;
}

.modern-btn-primary {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%) !important;
    color: white !important;
}

.modern-btn-primary:hover {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%) !important;
    transform: translateY(-1px) !important;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3) !important;
}

.modern-btn-secondary {
    background: #f3f4f6 !important;
    color: #374151 !important;
    border-color: #d1d5db !important;
}

.modern-btn-secondary:hover {
    background: #e5e7eb !important;
    transform: translateY(-1px) !important;
}

.modern-btn-back {
    background: #f3f4f6 !important;
    color: #374151 !important;
    border-color: #d1d5db !important;
}

.modern-btn-back:hover {
    background: #e5e7eb !important;
    transform: translateX(4px) !important;
}

.modern-btn-sm {
    padding: 0.375rem 0.875rem !important;
    font-size: 0.8125rem !important;
}

/* RTL Support */
[dir="rtl"] .modern-btn-back:hover {
    transform: translateX(-4px) !important;
}
</style>
{% endblock %}
