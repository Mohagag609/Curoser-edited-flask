{% extends "base.html" %}

{% block title %}إضافة شريك جديد{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <!-- Header with Back Button -->
    <div class="mb-6 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <a href="{{ url_for('partners.index') }}" class="modern-btn modern-btn-back modern-btn-sm">
                <i class="fas fa-arrow-right"></i>
                <span>رجوع</span>
            </a>
            <h2 class="text-2xl font-bold text-gray-900">إضافة شريك جديد</h2>
        </div>
    </div>
    
    <!-- Form Card -->
    <div class="card">
        <form method="post" action="{{ url_for('partners.add') }}"
              data-ajax="true"
              data-loading-message="جاري إضافة الشريك..."
              data-success-message="تم إضافة الشريك بنجاح!"
              data-error-message="حدث خطأ أثناء إضافة الشريك"
              data-redirect-on-success="true">
            
            <!-- Auto Code Notice -->
            <div class="mb-6 bg-blue-50 border border-blue-200 rounded-lg p-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <i class="fas fa-info-circle text-blue-400"></i>
                    </div>
                    <div class="mr-3">
                        <p class="text-sm text-blue-700">
                            سيتم إنشاء رقم الشريك تلقائياً عند الحفظ
                        </p>
                    </div>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Name -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        اسم الشريك <span class="text-red-500">*</span>
                    </label>
                    <input type="text" name="name" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="مثال: أحمد محمد علي"
                           autofocus>
                </div>
                
                <!-- Phone -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        رقم الهاتف
                    </label>
                    <input type="tel" name="phone" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="01234567890"
                           dir="ltr">
                </div>
                
                <!-- National ID -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        الرقم القومي
                    </label>
                    <input type="text" name="national_id" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="12345678901234"
                           dir="ltr">
                </div>
                
                <!-- Share Percentage -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        نسبة الشراكة (%)
                    </label>
                    <input type="number" name="share_percentage" 
                           value="0"
                           min="0" max="100" step="0.01"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           dir="ltr">
                </div>
                
                <!-- Status -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        الحالة
                    </label>
                    <select name="status" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="نشط">نشط</option>
                        <option value="غير نشط">غير نشط</option>
                    </select>
                </div>
                
                <!-- Address -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        العنوان
                    </label>
                    <textarea name="address" rows="2" 
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                              placeholder="العنوان الكامل للشريك"></textarea>
                </div>
                
                <!-- Notes -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        ملاحظات
                    </label>
                    <textarea name="notes" rows="3" 
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                              placeholder="أي ملاحظات إضافية..."></textarea>
                </div>
            </div>
            
            <!-- Form Actions -->
            <div class="mt-6 flex justify-end gap-3">
                <a href="{{ url_for('partners.index') }}" 
                   class="modern-btn modern-btn-secondary">
                    <i class="fas fa-times"></i>
                    <span>إلغاء</span>
                </a>
                <button type="submit" class="modern-btn modern-btn-primary">
                    <i class="fas fa-save"></i>
                    <span>حفظ الشريك</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<style>
.notification {
    position: fixed;
    top: 20px;
    right: 20px;
    background: white;
    border-radius: 8px;
    padding: 16px 20px;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 300px;
    max-width: 500px;
    z-index: 1000;
    opacity: 0;
    transform: translateX(100%);
    transition: all 0.3s ease;
}

.notification.show {
    opacity: 1;
    transform: translateX(0);
}

.notification.success {
    border-right: 4px solid #10b981;
}

.notification.error {
    border-right: 4px solid #ef4444;
}
</style>

<script>
// Simple notification function
function notify(message, type = 'success') {
    const notification = document.createElement('div');
    notification.className = `notification ${type}`;
    
    const icon = type === 'success' ? 'fa-check-circle' : 'fa-times-circle';
    const iconColor = type === 'success' ? '#10b981' : '#ef4444';
    
    notification.innerHTML = `
        <i class="fas ${icon}" style="color: ${iconColor}; font-size: 20px;"></i>
        <span>${message}</span>
    `;
    
    document.body.appendChild(notification);
    
    setTimeout(() => notification.classList.add('show'), 10);
    
    setTimeout(() => {
        notification.classList.remove('show');
        setTimeout(() => notification.remove(), 300);
    }, 5000);
}

// Make it available globally
window.notify = notify;
document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('form[method="post"]');
    if (form) {
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = form.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin ml-2"></i> جاري الحفظ...';
            submitBtn.disabled = true;
            
            try {
                const formData = new FormData(form);
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        // Show success notification
                        if (window.notify) {
                            window.notify(data.message || 'تم حفظ الشريك بنجاح', 'success');
                        }
                        
                        // Redirect after a short delay
                        setTimeout(() => {
                            window.location.href = data.redirect || '{{ url_for("partners.index") }}';
                        }, 1000);
                    } else {
                        if (window.notify) {
                            window.notify(data.message || 'حدث خطأ', 'error');
                        }
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                    }
                } else {
                    const data = await response.json();
                    if (window.notify) {
                        window.notify(data.message || 'حدث خطأ في الحفظ', 'error');
                    }
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                if (window.notify) {
                    window.notify('حدث خطأ في الاتصال', 'error');
                }
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    }
});
</script>
{% endblock %}
