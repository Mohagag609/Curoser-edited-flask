{% extends "base.html" %}

{% block title %}إضافة مقاول جديد{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <!-- Header with Back Button -->
    <div class="mb-6 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <a href="{{ url_for('contractors.index') }}" class="modern-btn modern-btn-back modern-btn-sm">
                <i class="fas fa-arrow-right"></i>
                <span>رجوع</span>
            </a>
            <h2 class="text-2xl font-bold text-gray-900">إضافة مقاول جديد</h2>
        </div>
    </div>
    
    <!-- Form Card -->
    <div class="card">
        <form method="post" action="{{ url_for('contractors.add') }}"
              data-ajax="true"
              data-loading-message="جاري إضافة المقاول..."
              data-success-message="تم إضافة المقاول بنجاح!"
              data-error-message="حدث خطأ أثناء إضافة المقاول"
              data-redirect-on-success="true">
            
            <!-- Auto Code Notice -->
            <div class="mb-6 bg-blue-50 border border-blue-200 rounded-lg p-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <i class="fas fa-info-circle text-blue-400"></i>
                    </div>
                    <div class="mr-3">
                        <p class="text-sm text-blue-700">
                            سيتم إنشاء رقم المقاول تلقائياً عند الحفظ
                        </p>
                    </div>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Name -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        اسم المقاول <span class="text-red-500">*</span>
                    </label>
                    <input type="text" name="name" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="مثال: شركة البناء المتقدم"
                           autofocus>
                </div>
                
                <!-- Phone -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        رقم الهاتف
                    </label>
                    <input type="tel" name="phone" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="01234567890"
                           dir="ltr">
                </div>
                
                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        البريد الإلكتروني
                    </label>
                    <input type="email" name="email" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="example@company.com"
                           dir="ltr">
                </div>
                
                <!-- Specialization -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        التخصص
                    </label>
                    <input type="text" name="specialization" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="مثال: بناء، تشطيبات، كهرباء">
                </div>
                
                <!-- Status -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        الحالة
                    </label>
                    <select name="status" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="نشط">نشط</option>
                        <option value="غير نشط">غير نشط</option>
                    </select>
                </div>
                
                <!-- Address -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        العنوان
                    </label>
                    <textarea name="address" rows="2" 
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                              placeholder="العنوان الكامل للمقاول"></textarea>
                </div>
                
                <!-- Notes -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        ملاحظات
                    </label>
                    <textarea name="notes" rows="3" 
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                              placeholder="أي ملاحظات إضافية..."></textarea>
                </div>
            </div>
            
            <!-- Form Actions -->
            <div class="mt-6 flex justify-end gap-3">
                <a href="{{ url_for('contractors.index') }}" 
                   class="modern-btn modern-btn-secondary">
                    <i class="fas fa-times"></i>
                    <span>إلغاء</span>
                </a>
                <button type="submit" class="modern-btn modern-btn-primary">
                    <i class="fas fa-save"></i>
                    <span>حفظ المقاول</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
