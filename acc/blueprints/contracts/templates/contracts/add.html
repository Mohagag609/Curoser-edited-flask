{% extends "base.html" %}

{% block title %}إضافة عقد جديد{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <!-- Header with Back Button -->
    <div class="mb-6 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <a href="{{ url_for('contracts.index') }}" class="modern-btn modern-btn-back modern-btn-sm">
                <i class="fas fa-arrow-right"></i>
                <span>رجوع</span>
            </a>
            <h2 class="text-2xl font-bold text-gray-900">إضافة عقد جديد</h2>
        </div>
    </div>
    
    <!-- Form Card -->
    <div class="card">
        <form method="post" action="{{ url_for('contracts.add') }}"
              data-ajax="true"
              data-loading-message="جاري إضافة العقد..."
              data-success-message="تم إضافة العقد بنجاح!"
              data-error-message="حدث خطأ أثناء إضافة العقد"
              data-redirect-on-success="true">
            
            <!-- Auto Code Notice -->
            <div class="mb-6 bg-blue-50 border border-blue-200 rounded-lg p-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <i class="fas fa-info-circle text-blue-400"></i>
                    </div>
                    <div class="mr-3">
                        <p class="text-sm text-blue-700">
                            سيتم إنشاء رقم العقد تلقائياً عند الحفظ
                        </p>
                    </div>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Date -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        تاريخ العقد <span class="text-red-500">*</span>
                    </label>
                    <input type="date" name="date" required 
                           value="{{ today }}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <!-- Customer -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        العميل <span class="text-red-500">*</span>
                    </label>
                    <select name="customer_id" required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">اختر العميل</option>
                        {% for customer in customers %}
                        <option value="{{ customer.id }}">{{ customer.name }} - {{ customer.phone or 'لا يوجد هاتف' }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- Unit -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        الوحدة <span class="text-red-500">*</span>
                    </label>
                    <select name="unit_id" required id="unit_id"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            onchange="updateUnitPrice()">
                        <option value="">اختر الوحدة</option>
                        {% for unit in units %}
                        <option value="{{ unit.id }}" data-price="{{ unit.price }}">
                            {{ unit.code }} - {{ unit.name }} - {{ format_currency(unit.price) }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- Broker -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        الوسيط
                    </label>
                    <select name="broker_id" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">بدون وسيط</option>
                        {% for broker in brokers %}
                        <option value="{{ broker.id }}">{{ broker.name }} - عمولة {{ broker.commission_percentage }}%</option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- Booking Amount -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        مبلغ العربون
                    </label>
                    <input type="number" name="booking_amount" 
                           value="0"
                           min="0" step="0.01"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           dir="ltr">
                </div>
                
                <!-- Contract Amount -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        قيمة العقد
                    </label>
                    <input type="number" name="contract_amount" id="contract_amount"
                           value="0"
                           min="0" step="0.01"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           dir="ltr">
                </div>
                
                <!-- Broker Commission -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        عمولة الوسيط
                    </label>
                    <input type="number" name="broker_commission" 
                           value="0"
                           min="0" step="0.01"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           dir="ltr">
                </div>
                
                <!-- Notes -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        ملاحظات
                    </label>
                    <textarea name="notes" rows="3" 
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                              placeholder="أي ملاحظات إضافية..."></textarea>
                </div>
            </div>
            
            <!-- Form Actions -->
            <div class="mt-6 flex justify-end gap-3">
                <a href="{{ url_for('contracts.index') }}" 
                   class="modern-btn modern-btn-secondary">
                    <i class="fas fa-times"></i>
                    <span>إلغاء</span>
                </a>
                <button type="submit" class="modern-btn modern-btn-primary">
                    <i class="fas fa-save"></i>
                    <span>حفظ العقد</span>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function updateUnitPrice() {
    const unitSelect = document.getElementById('unit_id');
    const contractAmountInput = document.getElementById('contract_amount');
    
    if (unitSelect.value) {
        const selectedOption = unitSelect.options[unitSelect.selectedIndex];
        const price = selectedOption.getAttribute('data-price');
        contractAmountInput.value = price;
    } else {
        contractAmountInput.value = 0;
    }
}
</script>
{% endblock %}
