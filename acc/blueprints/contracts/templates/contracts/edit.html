{% extends "base.html" %}

{% block title %}تعديل العقد - {{ contract.code }}{% endblock %}
{% block page_title %}تعديل العقد{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-lg shadow p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-gray-900">تعديل عقد رقم: {{ contract.code }}</h2>
            <a href="{{ url_for('contracts.index') }}" class="btn btn-secondary">
                <i class="fas fa-arrow-right"></i>
                رجوع
            </a>
        </div>
        
        <form method="POST" action="{{ url_for('contracts.edit', id=contract.id) }}">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Total Price -->
                <div class="form-group">
                    <label class="block text-sm font-medium text-gray-700 mb-2">السعر الكلي</label>
                    <input type="number" 
                           name="total_price" 
                           value="{{ contract.total_price }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           required 
                           min="0" 
                           step="0.01">
                </div>
                
                <!-- Down Payment -->
                <div class="form-group">
                    <label class="block text-sm font-medium text-gray-700 mb-2">المبلغ المدفوع</label>
                    <input type="number" 
                           name="down_payment" 
                           value="{{ contract.down_payment }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           min="0" 
                           step="0.01">
                </div>
                
                <!-- Broker Name -->
                <div class="form-group">
                    <label class="block text-sm font-medium text-gray-700 mb-2">اسم السمسار</label>
                    <input type="text" 
                           name="broker_name" 
                           value="{{ contract.broker_name or '' }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <!-- Broker Percentage -->
                <div class="form-group">
                    <label class="block text-sm font-medium text-gray-700 mb-2">نسبة العمولة %</label>
                    <input type="number" 
                           name="broker_percent" 
                           value="{{ contract.broker_percent or 0 }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           min="0" 
                           max="100" 
                           step="0.01">
                </div>
                
                <!-- Maintenance Deposit -->
                <div class="form-group">
                    <label class="block text-sm font-medium text-gray-700 mb-2">وديعة الصيانة</label>
                    <input type="number" 
                           name="maintenance_deposit" 
                           value="{{ contract.maintenance_deposit or 0 }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           min="0" 
                           step="0.01">
                </div>
                
                <!-- Status -->
                <div class="form-group">
                    <label class="block text-sm font-medium text-gray-700 mb-2">الحالة</label>
                    <select name="status" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="نشط" {% if contract.status == 'نشط' %}selected{% endif %}>نشط</option>
                        <option value="مكتمل" {% if contract.status == 'مكتمل' %}selected{% endif %}>مكتمل</option>
                        <option value="ملغي" {% if contract.status == 'ملغي' %}selected{% endif %}>ملغي</option>
                    </select>
                </div>
            </div>
            
            <div class="mt-6 flex justify-end gap-3">
                <a href="{{ url_for('contracts.view', id=contract.id) }}" class="btn btn-secondary">
                    إلغاء
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save ml-2"></i>
                    حفظ التعديلات
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
