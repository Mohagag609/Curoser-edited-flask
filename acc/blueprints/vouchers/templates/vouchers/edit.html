{% extends "base.html" %}

{% block title %}تعديل سند - {{ super() }}{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-3xl font-bold text-gray-900">تعديل سند</h2>
        <a href="{{ url_for('vouchers.detail', id=voucher.id) }}" class="btn btn-secondary">
            <i class="fas fa-arrow-right"></i>
            العودة للتفاصيل
        </a>
    </div>
    
    <!-- Form -->
    <div class="card max-w-3xl mx-auto">
        <form method="post" action="{{ url_for('vouchers.edit', id=voucher.id) }}">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Type -->
                <div>
                    <label class="form-label">نوع السند <span class="text-red-500">*</span></label>
                    <select name="type" class="form-select" onchange="updateForm(this)">
                        <option value="receipt" {% if voucher.type == 'receipt' %}selected{% endif %}>سند قبض</option>
                        <option value="payment" {% if voucher.type == 'payment' %}selected{% endif %}>سند صرف</option>
                    </select>
                </div>
                
                <!-- Safe -->
                <div>
                    <label class="form-label">الخزينة <span class="text-red-500">*</span></label>
                    <select name="safe_id" required class="form-select">
                        <option value="">اختر الخزينة...</option>
                        {% for safe in safes %}
                        <option value="{{ safe.id }}" {% if safe.id == voucher.safe_id %}selected{% endif %}>
                            {{ safe.name }} ({{ format_currency(safe.balance) }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- Amount -->
                <div>
                    <label class="form-label">المبلغ <span class="text-red-500">*</span></label>
                    <input type="number" name="amount" value="{{ voucher.amount }}" step="0.01" min="0.01" required class="form-input">
                </div>
                
                <!-- Date -->
                <div>
                    <label class="form-label">التاريخ <span class="text-red-500">*</span></label>
                    <input type="date" name="date" value="{{ voucher.date }}" required class="form-input">
                </div>
                
                <!-- Entity Type -->
                <div>
                    <label class="form-label">مرتبط بـ</label>
                    <select name="entity_type" class="form-select" onchange="updateEntitySelect(this)">
                        <option value="">غير مرتبط</option>
                        <option value="customer" {% if voucher.entity_type == 'customer' %}selected{% endif %}>عميل</option>
                        <option value="supplier" {% if voucher.entity_type == 'supplier' %}selected{% endif %}>مورد</option>
                        <option value="contractor" {% if voucher.entity_type == 'contractor' %}selected{% endif %}>مقاول</option>
                        <option value="partner" {% if voucher.entity_type == 'partner' %}selected{% endif %}>شريك</option>
                    </select>
                </div>
                
                <!-- Entity -->
                <div>
                    <label class="form-label" id="entity-label">
                        {% if voucher.entity_type == 'customer' %}العميل
                        {% elif voucher.entity_type == 'supplier' %}المورد
                        {% elif voucher.entity_type == 'contractor' %}المقاول
                        {% elif voucher.entity_type == 'partner' %}الشريك
                        {% else %}اختر...{% endif %}
                    </label>
                    <select name="entity_id" id="entity-select" class="form-select" {% if not voucher.entity_type %}disabled{% endif %}>
                        {% if not voucher.entity_type %}
                        <option value="">اختر النوع أولاً</option>
                        {% endif %}
                    </select>
                </div>
                
                <!-- Description -->
                <div class="md:col-span-2">
                    <label class="form-label">البيان <span class="text-red-500">*</span></label>
                    <input type="text" name="description" value="{{ voucher.description }}" required class="form-input">
                </div>
                
                <!-- Notes -->
                <div class="md:col-span-2">
                    <label class="form-label">ملاحظات</label>
                    <textarea name="notes" rows="3" class="form-input">{{ voucher.notes or '' }}</textarea>
                </div>
            </div>
            
            <div class="mt-6 flex justify-end gap-2">
                <a href="{{ url_for('vouchers.detail', id=voucher.id) }}" class="btn btn-secondary">
                    إلغاء
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i>
                    حفظ التعديلات
                </button>
            </div>
        </form>
    </div>
</div>

<script>
// Entities data
const entities = {
    customer: [
        {% for customer in customers %}
        {id: "{{ customer.id }}", name: "{{ customer.name }}"},
        {% endfor %}
    ],
    supplier: [
        {% for supplier in suppliers %}
        {id: "{{ supplier.id }}", name: "{{ supplier.name }}"},
        {% endfor %}
    ],
    contractor: [
        {% for contractor in contractors %}
        {id: "{{ contractor.id }}", name: "{{ contractor.name }}"},
        {% endfor %}
    ],
    partner: [
        {% for partner in partners %}
        {id: "{{ partner.id }}", name: "{{ partner.name }}"},
        {% endfor %}
    ]
};

const entityLabels = {
    customer: 'العميل',
    supplier: 'المورد',
    contractor: 'المقاول',
    partner: 'الشريك'
};

// Current entity
const currentEntityType = "{{ voucher.entity_type or '' }}";
const currentEntityId = "{{ voucher.entity_id or '' }}";

function updateForm(typeSelect) {
    // Update form based on voucher type
}

function updateEntitySelect(typeSelect) {
    const entitySelect = document.getElementById('entity-select');
    const entityLabel = document.getElementById('entity-label');
    const entityType = typeSelect.value;
    
    // Clear current options
    entitySelect.innerHTML = '';
    
    if (!entityType) {
        entitySelect.disabled = true;
        entitySelect.innerHTML = '<option value="">اختر النوع أولاً</option>';
        entityLabel.textContent = 'اختر...';
        return;
    }
    
    // Enable select
    entitySelect.disabled = false;
    entityLabel.textContent = entityLabels[entityType];
    
    // Add default option
    entitySelect.innerHTML = '<option value="">اختر ' + entityLabels[entityType] + '...</option>';
    
    // Add entities
    const entityList = entities[entityType];
    entityList.forEach(entity => {
        const option = document.createElement('option');
        option.value = entity.id;
        option.textContent = entity.name;
        if (entityType === currentEntityType && entity.id === currentEntityId) {
            option.selected = true;
        }
        entitySelect.appendChild(option);
    });
}

// Initialize entity select if needed
if (currentEntityType) {
    window.addEventListener('DOMContentLoaded', function() {
        const typeSelect = document.querySelector('select[name="entity_type"]');
        updateEntitySelect(typeSelect);
    });
}
</script>
{% endblock %}
