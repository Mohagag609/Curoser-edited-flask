{% extends "base.html" %}

{% block title %}إنشاء مشروع جديد{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <!-- Header with Back Button -->
    <div class="mb-6 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <a href="{{ url_for('projects.index') }}" class="modern-btn modern-btn-back modern-btn-sm">
                <i class="fas fa-arrow-right"></i>
                <span>رجوع</span>
            </a>
            <h2 class="text-2xl font-bold text-gray-900">إنشاء مشروع جديد</h2>
        </div>
    </div>
    
    <!-- Form Card -->
    <div class="card">
        <form method="post" action="{{ url_for('projects.add') }}"
              data-ajax="true"
              data-no-loading="true"
              data-success-message="تم إنشاء المشروع بنجاح!"
              data-error-message="حدث خطأ أثناء إنشاء المشروع"
              data-redirect-on-success="true">
            
            <!-- Auto Code Notice -->
            <div class="mb-6 bg-blue-50 border border-blue-200 rounded-lg p-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <i class="fas fa-info-circle text-blue-400"></i>
                    </div>
                    <div class="mr-3">
                        <p class="text-sm text-blue-700">
                            سيتم إنشاء رقم المشروع تلقائياً عند الحفظ
                        </p>
                    </div>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Name -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        اسم المشروع <span class="text-red-500">*</span>
                    </label>
                    <input type="text" name="name" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="مثال: مشروع أبراج السلام"
                           autofocus>
                </div>
                
                <!-- Project Type -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        نوع المشروع <span class="text-red-500">*</span>
                    </label>
                    <div class="space-y-3">
                        <label class="flex items-start gap-3 p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors">
                            <input type="radio" name="project_type" value="عقاري" checked 
                                   class="mt-1 text-blue-600 focus:ring-blue-500">
                            <div class="flex-1">
                                <div class="font-semibold text-gray-900">مشروع عقاري</div>
                                <div class="text-sm text-gray-600 mt-1">
                                    نظام متكامل يشمل: الوحدات، العقود، الأقساط، وجميع الميزات
                                </div>
                            </div>
                        </label>
                        <label class="flex items-start gap-3 p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors">
                            <input type="radio" name="project_type" value="محاسبي" 
                                   class="mt-1 text-blue-600 focus:ring-blue-500">
                            <div class="flex-1">
                                <div class="font-semibold text-gray-900">مشروع محاسبي</div>
                                <div class="text-sm text-gray-600 mt-1">
                                    نظام محاسبي بدون: الوحدات، العقود، الأقساط
                                </div>
                            </div>
                        </label>
                    </div>
                </div>
                
                <!-- Location -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        الموقع
                    </label>
                    <input type="text" name="location" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="مثال: الرياض - حي العليا">
                </div>
                
                <!-- Area -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        المساحة
                    </label>
                    <input type="text" name="area" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="مثال: 5000 م²">
                </div>
                
                <!-- Budget -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        الميزانية المتوقعة
                    </label>
                    <input type="number" name="budget" step="0.01" min="0"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="0.00">
                </div>
                
                <!-- Contractor -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        المقاول
                    </label>
                    <select name="contractor_id" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">-- اختر المقاول --</option>
                        {% for contractor in contractors %}
                        <option value="{{ contractor.id }}">{{ contractor.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- Start Date -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        تاريخ البداية
                    </label>
                    <input type="date" name="start_date" 
                           value="{{ datetime.now().strftime('%Y-%m-%d') }}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <!-- End Date -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        التاريخ المتوقع للانتهاء
                    </label>
                    <input type="date" name="end_date" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <!-- Status -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        الحالة
                    </label>
                    <select name="status" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="نشط" selected>نشط</option>
                        <option value="متوقف">متوقف</option>
                        <option value="مكتمل">مكتمل</option>
                    </select>
                </div>
                
                <!-- Empty cell for grid alignment -->
                <div></div>
                
                <!-- Description -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        وصف المشروع
                    </label>
                    <textarea name="description" rows="4" 
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                              placeholder="وصف تفصيلي للمشروع..."></textarea>
                </div>
            </div>
            
            <!-- Form Actions -->
            <div class="mt-6 flex gap-3 justify-end">
                <a href="{{ url_for('projects.index') }}" class="modern-btn modern-btn-secondary">
                    <i class="fas fa-times"></i>
                    إلغاء
                </a>
                <button type="submit" class="modern-btn modern-btn-add">
                    <i class="fas fa-save"></i>
                    إنشاء المشروع
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
