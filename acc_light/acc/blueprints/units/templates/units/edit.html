{% extends "base.html" %}

{% block title %}تعديل {{ unit.get_display_name() }} - {{ super() }}{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="mb-6">
        <div class="flex items-center gap-4 mb-4">
            <a href="{{ url_for('units.detail', id=unit.id) }}" class="text-gray-600 hover:text-gray-900">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
            </a>
            <h2 class="text-2xl font-bold text-gray-900">تعديل بيانات الوحدة</h2>
        </div>
        <p class="text-gray-600">تعديل بيانات الوحدة: <span class="font-mono font-medium">{{ unit.code }}</span></p>
    </div>
    
    <form method="post" action="{{ url_for('units.edit', id=unit.id) }}">
        <!-- Basic Information Card -->
        <div class="card mb-6">
            <h3 class="text-lg font-semibold text-gray-900 mb-6 pb-4 border-b">المعلومات الأساسية</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="form-label" for="building">المبنى/البرج *</label>
                    <input type="text" 
                           id="building" 
                           name="building" 
                           value="{{ unit.building }}"
                           class="form-input" 
                           required>
                </div>
                
                <div>
                    <label class="form-label" for="floor">الدور *</label>
                    <input type="text" 
                           id="floor" 
                           name="floor" 
                           value="{{ unit.floor }}"
                           class="form-input" 
                           required>
                </div>
                
                <div>
                    <label class="form-label" for="name">رقم/اسم الوحدة *</label>
                    <input type="text" 
                           id="name" 
                           name="name" 
                           value="{{ unit.name }}"
                           class="form-input" 
                           required>
                </div>
            </div>
            
            <div class="mt-4 p-4 bg-blue-50 rounded-lg">
                <p class="text-sm text-blue-800">
                    <strong>كود الوحدة الجديد سيكون:</strong> 
                    <span id="unit-code-preview" class="font-mono">{{ unit.code }}</span>
                </p>
            </div>
        </div>
        
        <!-- Details Card -->
        <div class="card mb-6">
            <h3 class="text-lg font-semibold text-gray-900 mb-6 pb-4 border-b">التفاصيل</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="form-label" for="unit_type">نوع الوحدة</label>
                    <select id="unit_type" name="unit_type" class="form-select">
                        <option value="سكني" {% if unit.unit_type == 'سكني' %}selected{% endif %}>سكني</option>
                        <option value="تجاري" {% if unit.unit_type == 'تجاري' %}selected{% endif %}>تجاري</option>
                        <option value="إداري" {% if unit.unit_type == 'إداري' %}selected{% endif %}>إداري</option>
                        <option value="صناعي" {% if unit.unit_type == 'صناعي' %}selected{% endif %}>صناعي</option>
                    </select>
                </div>
                
                <div>
                    <label class="form-label" for="area">المساحة (م²)</label>
                    <input type="number" 
                           id="area" 
                           name="area" 
                           value="{{ unit.area or '' }}"
                           class="form-input" 
                           step="0.01">
                </div>
                
                <div class="md:col-span-2">
                    <label class="form-label" for="total_price">السعر الكلي *</label>
                    <div class="relative">
                        <input type="number" 
                               id="total_price" 
                               name="total_price" 
                               value="{{ unit.total_price }}"
                               class="form-input pl-16" 
                               step="0.01"
                               required>
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="text-gray-500 sm:text-sm">ج.م</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-6">
                <label class="form-label" for="notes">ملاحظات</label>
                <textarea id="notes" 
                          name="notes" 
                          rows="3" 
                          class="form-input">{{ unit.notes or '' }}</textarea>
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="flex gap-3">
            <button type="submit" class="btn btn-primary">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                حفظ التغييرات
            </button>
            <a href="{{ url_for('units.detail', id=unit.id) }}" class="btn btn-secondary">إلغاء</a>
        </div>
    </form>
</div>

<script>
// Preview unit code
function updateCodePreview() {
    const building = document.getElementById('building').value || '?';
    const floor = document.getElementById('floor').value || '?';
    const name = document.getElementById('name').value || '?';
    const preview = document.getElementById('unit-code-preview');
    preview.textContent = `${building}-${floor}-${name}`;
}

document.getElementById('building').addEventListener('input', updateCodePreview);
document.getElementById('floor').addEventListener('input', updateCodePreview);
document.getElementById('name').addEventListener('input', updateCodePreview);
</script>
{% endblock %}
