{% extends "base.html" %}

{% block title %}إضافة مجموعة شركاء - {{ super() }}{% endblock %}

{% block page_title %}إضافة مجموعة شركاء جديدة{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="card">
        <form method="post">
            <div class="grid grid-cols-1 gap-6">
                <!-- Phase Selection -->
                <div>
                    <label class="form-label required">المرحلة</label>
                    <select name="phase_id" class="form-select" required>
                        <option value="">اختر المرحلة</option>
                        {% for phase in phases %}
                        <option value="{{ phase.id }}">
                            {{ phase.name }} - {{ phase.project.name }}
                            {% set current_total = phase.partner_groups.with_entities(func.sum(PhasePartnerGroup.share_percentage)).scalar() or 0 %}
                            {% if current_total > 0 %}
                                <span class="text-gray-500">(النسبة المستخدمة: {{ current_total }}%)</span>
                            {% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Group Name -->
                <div>
                    <label class="form-label required">اسم المجموعة</label>
                    <input type="text" name="name" class="form-input" 
                           placeholder="مثال: مجموعة الملاك الرئيسيين" required>
                </div>

                <!-- Share Percentage -->
                <div>
                    <label class="form-label required">نسبة المجموعة في المرحلة (%)</label>
                    <input type="number" name="share_percentage" class="form-input" 
                           min="0" max="100" step="0.01" required>
                    <p class="text-sm text-gray-500 mt-1">
                        النسبة الإجمالية لجميع المجموعات في المرحلة يجب ألا تتجاوز 100%
                    </p>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <a href="{{ url_for('settlement.phase_partners_index') }}" class="btn btn-secondary">
                    إلغاء
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i>
                    حفظ المجموعة
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
