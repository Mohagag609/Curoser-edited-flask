{% extends "base.html" %}

{% block title %}إعدادات النظام{% endblock %}

{% block content %}
<div class="mb-8">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-bold text-gray-900">إعدادات النظام</h2>
    </div>
    
    <form method="post">
        <!-- معلومات الشركة -->
        <div class="card mb-6">
            <h3 class="text-lg font-semibold mb-4">معلومات الشركة</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="form-label">اسم الشركة</label>
                    <input type="text" name="company_name" value="{{ settings.company_name or '' }}" 
                           class="form-input" placeholder="شركة العقارات المتحدة">
                </div>
                <div>
                    <label class="form-label">رقم الهاتف</label>
                    <input type="text" name="company_phone" value="{{ settings.company_phone or '' }}" 
                           class="form-input" placeholder="01234567890">
                </div>
                <div>
                    <label class="form-label">البريد الإلكتروني</label>
                    <input type="email" name="company_email" value="{{ settings.company_email or '' }}" 
                           class="form-input" placeholder="info@company.com">
                </div>
                <div>
                    <label class="form-label">الرقم الضريبي</label>
                    <input type="text" name="tax_number" value="{{ settings.tax_number or '' }}" 
                           class="form-input" placeholder="123-456-789">
                </div>
                <div class="md:col-span-2">
                    <label class="form-label">العنوان</label>
                    <textarea name="company_address" rows="2" class="form-input">{{ settings.company_address or '' }}</textarea>
                </div>
                <div>
                    <label class="form-label">السجل التجاري</label>
                    <input type="text" name="commercial_register" value="{{ settings.commercial_register or '' }}" 
                           class="form-input">
                </div>
            </div>
        </div>
        
        <!-- إعدادات العملة -->
        <div class="card mb-6">
            <h3 class="text-lg font-semibold mb-4">إعدادات العملة</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="form-label">رمز العملة</label>
                    <input type="text" name="currency_symbol" value="{{ settings.currency_symbol or 'ج.م' }}" 
                           class="form-input">
                </div>
                <div>
                    <label class="form-label">موضع العملة</label>
                    <select name="currency_position" class="form-input">
                        <option value="after" {% if settings.currency_position == 'after' %}selected{% endif %}>بعد المبلغ</option>
                        <option value="before" {% if settings.currency_position == 'before' %}selected{% endif %}>قبل المبلغ</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- إعدادات النظام -->
        <div class="card mb-6">
            <h3 class="text-lg font-semibold mb-4">إعدادات النظام</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="form-label">بداية السنة المالية</label>
                    <input type="text" name="fiscal_year_start" value="{{ settings.fiscal_year_start or '01-01' }}" 
                           class="form-input" placeholder="01-01">
                </div>
                <div>
                    <label class="form-label">مدة السداد الافتراضية (بالأيام)</label>
                    <input type="number" name="default_payment_terms" value="{{ settings.default_payment_terms or 30 }}" 
                           class="form-input">
                </div>
                <div>
                    <label class="form-label">بادئة الفواتير</label>
                    <input type="text" name="invoice_prefix" value="{{ settings.invoice_prefix or 'INV-' }}" 
                           class="form-input">
                </div>
                <div>
                    <label class="form-label">بادئة العقود</label>
                    <input type="text" name="contract_prefix" value="{{ settings.contract_prefix or 'CT-' }}" 
                           class="form-input">
                </div>
            </div>
        </div>
        
        <!-- إعدادات الإشعارات -->
        <div class="card mb-6">
            <h3 class="text-lg font-semibold mb-4">إعدادات الإشعارات</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="form-label">
                        <input type="checkbox" name="enable_email_notifications" 
                               {% if settings.enable_email_notifications %}checked{% endif %}>
                        تفعيل الإشعارات بالبريد الإلكتروني
                    </label>
                </div>
                <div>
                    <label class="form-label">بريد الإشعارات</label>
                    <input type="email" name="notification_email" value="{{ settings.notification_email or '' }}" 
                           class="form-input" placeholder="notifications@company.com">
                </div>
            </div>
        </div>
        
        <!-- إعدادات النسخ الاحتياطي -->
        <div class="card mb-6">
            <h3 class="text-lg font-semibold mb-4">إعدادات النسخ الاحتياطي</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="form-label">
                        <input type="checkbox" name="auto_backup_enabled" 
                               {% if settings.auto_backup_enabled %}checked{% endif %}>
                        تفعيل النسخ الاحتياطي التلقائي
                    </label>
                </div>
                <div>
                    <label class="form-label">تكرار النسخ</label>
                    <select name="backup_frequency" class="form-input">
                        <option value="daily" {% if settings.backup_frequency == 'daily' %}selected{% endif %}>يومي</option>
                        <option value="weekly" {% if settings.backup_frequency == 'weekly' %}selected{% endif %}>أسبوعي</option>
                        <option value="monthly" {% if settings.backup_frequency == 'monthly' %}selected{% endif %}>شهري</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">مدة الاحتفاظ بالنسخ (بالأيام)</label>
                    <input type="number" name="backup_retention_days" value="{{ settings.backup_retention_days or 30 }}" 
                           class="form-input" min="7" max="365">
                </div>
            </div>
        </div>
        
        <div class="flex gap-3">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save ml-2"></i>
                حفظ الإعدادات
            </button>
        </div>
    </form>
</div>
{% endblock %}
