{% extends "base.html" %}

{% block title %}تعديل الشريك - {{ partner.name }}{% endblock %}
{% block page_title %}تعديل الشريك{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="card">
        <form method="post" action="{{ url_for('partners.edit', id=partner.id) }}"
              data-ajax="true" 
              data-loading-message="جاري تحديث الشريك..."
              data-success-message="تم تحديث الشريك بنجاح"
              data-error-message="فشل في تحديث الشريك">
            
            <!-- عرض الكود -->
            <div class="mb-4 p-3 bg-indigo-50 rounded-lg text-center">
                <span class="text-indigo-700 font-semibold">كود الشريك: </span>
                <span class="text-indigo-900 font-bold text-lg">{{ partner.code }}</span>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label class="form-label" for="name">اسم الشريك *</label>
                    <input type="text" 
                           id="name" 
                           name="name" 
                           value="{{ partner.name }}"
                           class="form-input" 
                           required
                           autofocus>
                </div>
                
                <div>
                    <label class="form-label" for="phone">رقم الهاتف</label>
                    <input type="text" 
                           id="phone" 
                           name="phone" 
                           value="{{ partner.phone or '' }}"
                           class="form-input">
                </div>
                
                <div>
                    <label class="form-label" for="national_id">الرقم القومي</label>
                    <input type="text" 
                           id="national_id" 
                           name="national_id" 
                           value="{{ partner.national_id or '' }}"
                           class="form-input">
                </div>
                
                <div class="md:col-span-2">
                    <label class="form-label" for="address">العنوان</label>
                    <input type="text" 
                           id="address" 
                           name="address" 
                           value="{{ partner.address or '' }}"
                           class="form-input">
                </div>
                
                <div class="md:col-span-2">
                    <label class="form-label" for="notes">ملاحظات</label>
                    <textarea id="notes" 
                              name="notes" 
                              rows="3" 
                              class="form-input">{{ partner.notes or '' }}</textarea>
                </div>
            </div>
            
            <div class="mt-6 flex gap-3">
                <button type="submit" class="btn btn-edit">
                    <i class="fas fa-save ml-2"></i>
                    حفظ التعديلات
                </button>
                <a href="{{ url_for('partners.detail', id=partner.id) }}" class="btn btn-secondary">
                    <i class="fas fa-times ml-2"></i>
                    إلغاء
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
