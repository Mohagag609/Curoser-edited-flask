{% extends "base.html" %}

{% block title %}إضافة مجموعة شركاء - {{ super() }}{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-3xl font-bold text-gray-900">إضافة مجموعة شركاء جديدة</h2>
        <a href="{{ url_for('partners.groups') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-right"></i>
            العودة للمجموعات
        </a>
    </div>
    
    <!-- Form -->
    <div class="card max-w-2xl mx-auto">
        <form method="post" action="{{ url_for('partners.add_group') }}">
            <div class="space-y-6">
                <div>
                    <label class="form-label">اسم المجموعة <span class="text-red-500">*</span></label>
                    <input type="text" name="name" required class="form-input" autofocus>
                </div>
                
                <div>
                    <label class="form-label">ملاحظات</label>
                    <textarea name="notes" rows="3" class="form-input"></textarea>
                </div>
            </div>
            
            <div class="mt-6 flex justify-end gap-2">
                <a href="{{ url_for('partners.groups') }}" class="btn btn-secondary">
                    إلغاء
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i>
                    حفظ
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
