{% extends "base.html" %}

{% block title %}تعديل {{ supplier.name }}{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <!-- Header with Back Button -->
    <div class="mb-6 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <a href="{{ url_for('suppliers.detail', id=supplier.id) }}" class="modern-btn modern-btn-back modern-btn-sm">
                <i class="fas fa-arrow-right"></i>
                <span>رجوع</span>
            </a>
            <h2 class="text-2xl font-bold text-gray-900">تعديل بيانات المورد</h2>
        </div>
    </div>
    
    <!-- Form Card -->
    <div class="card">
        <form method="post" action="{{ url_for('suppliers.edit', id=supplier.id) }}"
              data-ajax="true"
              data-loading-message="جاري حفظ التعديلات..."
              data-success-message="تم تعديل المورد بنجاح!"
              data-error-message="حدث خطأ أثناء التعديل"
              data-redirect-on-success="true">
            
            <!-- Code Display -->
            <div class="mb-6 bg-gray-50 border border-gray-200 rounded-lg p-4">
                <div class="flex items-center">
                    <i class="fas fa-barcode text-gray-400 ml-3"></i>
                    <div>
                        <p class="text-sm text-gray-600">رقم المورد</p>
                        <p class="font-mono font-medium text-gray-900">{{ supplier.code }}</p>
                    </div>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Name -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        اسم المورد <span class="text-red-500">*</span>
                    </label>
                    <input type="text" name="name" required 
                           value="{{ supplier.name }}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="مثال: شركة النور للتوريدات">
                </div>
                
                <!-- Contact Person -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        الشخص المسؤول
                    </label>
                    <input type="text" name="contact_person" 
                           value="{{ supplier.contact_person or '' }}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="اسم الشخص المسؤول">
                </div>
                
                <!-- Phone -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        رقم الهاتف
                    </label>
                    <input type="tel" name="phone" 
                           value="{{ supplier.phone or '' }}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="01234567890"
                           dir="ltr">
                </div>
                
                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        البريد الإلكتروني
                    </label>
                    <input type="email" name="email" 
                           value="{{ supplier.email or '' }}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="example@company.com"
                           dir="ltr">
                </div>
                
                <!-- Status -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        الحالة
                    </label>
                    <select name="status" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="نشط" {% if supplier.status == 'نشط' %}selected{% endif %}>نشط</option>
                        <option value="غير نشط" {% if supplier.status == 'غير نشط' %}selected{% endif %}>غير نشط</option>
                    </select>
                </div>
                
                <!-- Address -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        العنوان
                    </label>
                    <textarea name="address" rows="2" 
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                              placeholder="العنوان الكامل للمورد">{{ supplier.address or '' }}</textarea>
                </div>
                
                <!-- Notes -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        ملاحظات
                    </label>
                    <textarea name="notes" rows="3" 
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                              placeholder="أي ملاحظات إضافية...">{{ supplier.notes or '' }}</textarea>
                </div>
            </div>
            
            <!-- Form Actions -->
            <div class="mt-6 flex justify-end gap-3">
                <a href="{{ url_for('suppliers.detail', id=supplier.id) }}" 
                   class="modern-btn modern-btn-secondary">
                    <i class="fas fa-times"></i>
                    <span>إلغاء</span>
                </a>
                <button type="submit" class="modern-btn modern-btn-primary">
                    <i class="fas fa-save"></i>
                    <span>حفظ التعديلات</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
