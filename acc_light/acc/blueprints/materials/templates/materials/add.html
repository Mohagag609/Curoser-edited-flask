{% extends "base.html" %}

{% block title %}إضافة مادة جديدة{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <!-- Header with Back Button -->
    <div class="mb-6 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <a href="{{ url_for('materials.index') }}" class="modern-btn modern-btn-back modern-btn-sm">
                <i class="fas fa-arrow-right"></i>
                <span>رجوع</span>
            </a>
            <h2 class="text-2xl font-bold text-gray-900">إضافة مادة جديدة</h2>
        </div>
    </div>
    
    <!-- Form Card -->
    <div class="card">
        <form method="post" action="{{ url_for('materials.add') }}"
              data-ajax="true"
              data-loading-message="جاري إضافة المادة..."
              data-success-message="تم إضافة المادة بنجاح!"
              data-error-message="حدث خطأ أثناء إضافة المادة"
              data-redirect-on-success="true">
            
            <!-- Auto Code Notice -->
            <div class="mb-6 bg-blue-50 border border-blue-200 rounded-lg p-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <i class="fas fa-info-circle text-blue-400"></i>
                    </div>
                    <div class="mr-3">
                        <p class="text-sm text-blue-700">
                            سيتم إنشاء رقم المادة تلقائياً عند الحفظ
                        </p>
                    </div>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Name -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        اسم المادة <span class="text-red-500">*</span>
                    </label>
                    <input type="text" name="name" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="مثال: أسمنت بورتلاند"
                           autofocus>
                </div>
                
                <!-- Unit -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        وحدة القياس <span class="text-red-500">*</span>
                    </label>
                    <input type="text" name="unit" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="مثال: طن، متر، قطعة">
                </div>
                
                <!-- Unit Cost -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        سعر الوحدة الافتراضي
                    </label>
                    <input type="number" name="unit_cost" step="0.01" min="0" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="0.00">
                </div>
                
                <!-- Category -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        الفئة
                    </label>
                    <input type="text" name="category" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="مثال: مواد بناء">
                </div>
                
                <!-- Min Stock -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        الحد الأدنى للمخزون
                    </label>
                    <input type="number" name="min_stock" step="0.01" min="0" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="0">
                </div>
                
                <!-- Description -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        الوصف
                    </label>
                    <textarea name="description" rows="3" 
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                              placeholder="وصف تفصيلي للمادة..."></textarea>
                </div>
            </div>
            
            <!-- Form Actions -->
            <div class="mt-6 flex gap-3 justify-end">
                <a href="{{ url_for('materials.index') }}" class="modern-btn modern-btn-secondary">
                    <i class="fas fa-times"></i>
                    إلغاء
                </a>
                <button type="submit" class="modern-btn modern-btn-add">
                    <i class="fas fa-save"></i>
                    حفظ المادة
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
