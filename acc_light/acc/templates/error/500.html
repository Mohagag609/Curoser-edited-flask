{% extends "base.html" %}

{% block title %}خطأ في الخادم{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12">
    <div class="max-w-md w-full text-center">
        <div class="mb-8">
            <div class="inline-flex items-center justify-center w-24 h-24 bg-red-100 rounded-full mb-6">
                <i class="fas fa-exclamation-triangle text-4xl text-red-600"></i>
            </div>
            
            <h1 class="text-4xl font-bold text-gray-800 mb-4">500</h1>
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">خطأ في الخادم</h2>
            
            <p class="text-gray-600 mb-8">
                عذراً، حدث خطأ غير متوقع. نحن نعمل على حل المشكلة.
            </p>
            
            {% if current_app.debug and error %}
            <div class="bg-red-50 border border-red-200 rounded-lg p-4 text-right mb-6">
                <h3 class="font-semibold text-red-800 mb-2">تفاصيل الخطأ (Debug Mode):</h3>
                <pre class="text-xs text-red-700 overflow-x-auto">{{ error }}</pre>
            </div>
            {% endif %}
            
            <div class="space-y-3">
                <a href="{{ url_for('auth.welcome') }}" class="modern-btn modern-btn-secondary">
                    <i class="fas fa-home"></i>
                    الصفحة الرئيسية
                </a>
                
                <button onclick="window.history.back()" class="modern-btn modern-btn-secondary">
                    <i class="fas fa-arrow-right"></i>
                    رجوع
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
