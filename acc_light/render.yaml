databases:
  - name: acc-light-db
    databaseName: acc_light_db
    user: acc_light_user
    region: oregon

services:
  - type: web
    name: acc-light
    runtime: python
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn app:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: acc-light-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0